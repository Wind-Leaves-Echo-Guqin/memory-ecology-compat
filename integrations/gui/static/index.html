<!doctype html>
<html lang="zh-CN" data-palette="a">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>记忆生态 · 观测舱</title>
<link rel="stylesheet" href="/static/style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='%230e7490'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%23fff'/%3E%3C/svg%3E">
</head>
<body>

<!-- ── 左侧导航栏（图标由 viz/icons.js 注入内联 SVG：字重/基线统一，不再用 unicode 符号） ── -->
<nav id="nav">
  <div class="brand"><span class="brand-dot"></span>记忆生态<span class="brand-sub">观测舱 v0.3.3</span></div>
  <a data-view="dashboard" class="on" title="驾驶舱"><i data-ico="dashboard"></i><span>驾驶舱</span></a>
  <a data-view="memories" title="记忆库"><i data-ico="memories"></i><span>记忆库</span></a>
  <a data-view="experiences" title="经验笔记本"><i data-ico="experiences"></i><span>经验笔记本</span></a>
  <a data-view="starmap" title="技能星图"><i data-ico="starmap"></i><span>技能星图</span></a>
  <a data-view="lineage" title="血缘谱系"><i data-ico="lineage"></i><span>血缘谱系</span></a>
  <a data-view="candidates" title="候选孵化台"><i data-ico="candidates"></i><span>候选孵化台</span></a>
  <a data-view="timeline" title="时间线"><i data-ico="timeline"></i><span>时间线</span></a>
  <a data-view="health" title="体检评测"><i data-ico="health"></i><span>体检评测</span></a>
  <a data-view="actions" title="动作日志"><i data-ico="actions"></i><span>动作日志</span></a>
  <div class="nav-foot">
    <div class="nav-note">可操作驾驶舱<br>写操作全走确认闸门<br>单写入方不受影响</div>
  </div>
</nav>

<!-- ── 主区 ── -->
<div id="main">
  <header id="topbar">
    <div class="searchbox">
      <div class="pills" id="search-pills">
        <button data-k="note" class="on">经验</button>
        <button data-k="error">报错</button>
        <button data-k="eco">生态</button>
      </div>
      <input id="search-input" type="text" autocomplete="off"
             placeholder="检索经验 / 粘贴 Traceback / 生态级检索…（Enter 执行，粘贴报错自动切报错模式）">
      <button id="search-go" title="检索" data-ico="search"></button>
      <div id="search-panel" class="hidden"></div>
    </div>
    <div class="topbar-right">
      <button id="bell-btn" class="ghost-btn" title="全局告警铃铛（聚合 cron 失败/记忆越线/悬空引用/报告P0/候选）"><i data-ico="bell"></i><i id="bell-badge" class="badge hidden">0</i></button>
      <button id="firstaid-btn" class="ghost-btn" title="急救箱：深度自检 + 一键修复"><i data-ico="firstaid"></i><span class="btn-txt">急救箱</span></button>
      <div class="palette-dots" id="palette-dots" title="色板（换肤=换 token，语义色恒定）"></div>
      <button id="refresh-btn" class="ghost-btn" title="重新读取快照"><i data-ico="refresh"></i><span class="btn-txt">刷新</span></button>
    </div>
  </header>

  <main id="view"><div class="loading">正在读取生态快照…</div></main>

  <footer id="statusbar">
    <span id="sb-writer">…</span><span class="sep">|</span>
    <span id="sb-version">…</span><span class="sep">|</span>
    <span id="sb-root" class="ellipsis">…</span>
    <span class="sb-right">
      <span id="fps-badge" class="fps-badge hidden" title="实测帧率（星图/粒子运行时采样）">— fps</span>
      <span class="anim-ctl" id="anim-ctl" title="动画强度：轻度=仅淡入淡出；中度=过渡+度量+图表；满载=全部动效">
        <button data-lv="low" title="轻度">轻</button><button data-lv="medium" title="中度">中</button><button data-lv="full" title="满载">满</button>
      </span>
      <span class="export-ctl html-only" id="export-ctl" title="导出当前视图数据">
        <button data-exp="json" title="下载 JSON 文件">JSON</button><button data-exp="md" title="复制 Markdown 到剪贴板">MD</button><button data-exp="text" title="复制纯文本">文本</button>
      </span>
      <button id="cruise-btn" class="linklike" title="全屏巡航（Ctrl+Shift+F）：轮播九视图 / 固定驾驶舱大屏">巡航</button>
      <button id="diag-btn" class="linklike" title="复制诊断信息（版本/数据根/cron/水位/最近动作）">诊断</button>
      <button id="guide-btn" class="linklike" title="重看新手引导 / 清空「不再提醒」">？引导</button>
      <span class="fontsize-ctl"><button id="font-minus" title="全局字号减小">A-</button><button id="font-plus" title="全局字号增大">A+</button></span>
      <span id="sb-snapshot">数据截至 …</span>
      <i id="patrol-dot" class="patrol-dot" title="巡检：后台数据有新变化"></i>
    </span>
  </footer>
</div>

<!-- ── 详情抽屉 ── -->
<div id="drawer-mask" class="hidden"></div>
<aside id="drawer" class="hidden">
  <button id="drawer-close" title="关闭（Esc）" data-ico="close"></button>
  <div id="drawer-body"></div>
</aside>

<!-- ── 确认闸门弹窗（C3） ── -->
<div id="gate-mask" class="hidden"></div>
<div id="gate-modal" class="hidden"></div>

<!-- ── 告警铃铛面板 ── -->
<div id="bell-panel" class="hidden"></div>

<!-- ── 新手引导遮罩 ── -->
<div id="guide-mask" class="hidden"></div>

<!-- ── 快捷键参考浮层（?） ── -->
<div id="kbd-mask" class="hidden"></div>

<!-- ── 命令面板遮罩（Ctrl+K） ── -->
<div id="cmd-mask" class="hidden"></div>

<div id="toast" class="hidden"></div>

<script src="/static/js/polyfill.js"></script>
<script src="/static/js/api.js"></script>
<script src="/static/js/gate.js"></script>
<script src="/static/js/bell.js"></script>
<script src="/static/js/viz/anim.js"></script>
<script src="/static/js/viz/icons.js"></script>
<script src="/static/js/viz/force.js"></script>
<script src="/static/js/viz/gl3d.js"></script>
<script src="/static/js/viz/charts.js"></script>
<script src="/static/js/viz/particles.js"></script>
<script src="/static/js/views/dashboard.js"></script>
<script src="/static/js/views/memories.js"></script>
<script src="/static/js/views/experiences.js"></script>
<script src="/static/js/views/starmap.js"></script>
<script src="/static/js/views/lineage.js"></script>
<script src="/static/js/views/candidates.js"></script>
<script src="/static/js/views/timeline.js"></script>
<script src="/static/js/views/health.js"></script>
<script src="/static/js/views/actions.js"></script>
<script src="/static/js/views/firstaid.js"></script>
<script src="/static/js/shortcuts.js"></script>
<script src="/static/js/palette.js"></script>
<script src="/static/js/cruise.js"></script>
<script src="/static/js/core.js"></script>
</body>
</html>
